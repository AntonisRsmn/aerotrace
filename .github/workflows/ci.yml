name: Validate AeroTrace

on:
  push:
    branches:
      - main
      - feature/demo-mode
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run server tests
        run: npm test
      - name: Build frontend
        run: npm run build
